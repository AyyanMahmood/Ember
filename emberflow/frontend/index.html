<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No static <meta name="description">, canonical <link>, or og:*/twitter:*
      tags here on purpose: every route renders its own via the <Seo>
      component (react-helmet-async). Duplicating the same tags statically
      would create two conflicting copies in the DOM once React mounts —
      react-helmet-async only ever cleans up tags it previously rendered
      itself (tracked via its own data-rh attribute), so it can't remove or
      merge with tags that were already in this file. <title> is the one
      exception: Helmet updates document.title directly rather than
      appending a second <title> element, so a static default here is safe.
    -->
    <meta name="theme-color" content="#0A0C0E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <!-- Tells Chromium's Auto Dark Theme the page already implements both
         schemes correctly, so it stops force-inverting light mode (the cause
         of light mode rendering as a washed blue-grey on Android Chrome/Arc). -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>EmberFlow — Finance OS for Freelancers</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('emberflow-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
