<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EmberFlow helps freelancers manage clients, invoices, proposals, and payments."
    />
    <meta name="theme-color" content="#0A0C0E" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)" />
    <!-- Tells Chromium's Auto Dark Theme the page already implements both
         schemes correctly, so it stops force-inverting light mode (the cause
         of light mode rendering as a washed blue-grey on Android Chrome/Arc). -->
    <meta name="color-scheme" content="light dark" />
    <title>EmberFlow</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('emberflow-theme');
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
